name: CI

# Required status check for main's branch protection (see CONTRIBUTING.md).
# Every step below uses the project's own real commands - nothing invented
# for CI. Full suite (not a subset) since AEP's own testing policy runs the
# full suite once per stabilized change, and CI is exactly that point.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AEP (editable, all optional extras + dev)
        run: python -m pip install -e ".[all,dev]"

      - name: Python syntax/compile check
        run: python -m compileall -q src

      - name: Full test suite
        # Real local PostgreSQL via `pgserver` (zero-config, no service
        # container needed) - the same backend `pip install aep-platform`
        # gives an end user, see src/aep/db/local_postgres.py.
        run: python -m pytest -q

      - name: Built-in security scan of this repository (dogfooding `aep security`)
        # This repo's OWN source necessarily contains secret-shaped text
        # (src/aep/redaction.py's own detection patterns, the intentional
        # demo-fixture placeholder key, docs/BUGFIX.md entries describing
        # past fake-credential incidents by name) - a blanket PASS/FAIL
        # gate on `aep security`'s own status would be permanently red
        # for reasons that are not incidents, and disabling the scan
        # entirely would stop catching a REAL new secret. Runs AEP's
        # real, unmodified scanner in full, then fails the build only on
        # a finding that isn't already in the hand-reviewed
        # .github/security-baseline.json - see that file's `_readme` and
        # .github/check_security_baseline.py for the full reasoning.
        run: python .github/check_security_baseline.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: UI typecheck and build
        working-directory: ui
        run: |
          npm ci
          npx tsc --noEmit
          VITE_API_BASE= npx vite build --outDir ../src/aep/ui_dist --emptyOutDir

      - name: Build distribution (wheel + sdist)
        run: |
          python -m pip install build twine
          python -m build

      - name: twine check
        run: python -m twine check dist/*
