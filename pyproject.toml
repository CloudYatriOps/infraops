[project]
# PyPI distribution name. Intentionally different from the Python import
# package (`aep`, under src/aep/) and the CLI (`aep`) - "aep" was already
# registered on PyPI by an unrelated project (Adversary Emulation Planner,
# mnemonic AS) when this was checked, so the distribution/publication name
# is "aep-platform" while `import aep` and the `aep` console command are
# unaffected (see [project.scripts] below and the `all` extra's
# self-reference, both of which must use THIS name, not the import name).
name = "aep-platform"
version = "0.1.0"
description = "AEP: a local-first autonomous engineering and DevSecOps platform - policy-gated task orchestration, a versioned skill registry, and real security/dependency/infrastructure intelligence, backed by a zero-config embedded PostgreSQL. No PostgreSQL install, no Supabase, no remote database, no npm - `pip install aep-platform` then `aep`."
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
    "packaging>=21.0",
    # PostgreSQL is the DEFAULT runtime backend as of Phase 9 Stage A.5
    # (src/aep/db/factory.py::resolve_backend defaults to "postgres" with
    # nothing set). psycopg2/pgvector are therefore required, not optional
    # -- see BUGFIX.md BUG-0004. Do not move these back to
    # optional-dependencies unless the default backend resolution changes.
    "psycopg2-binary>=2.9",
    "pgvector>=0.2",
    # Zero-config local database. `pgserver` bundles real PostgreSQL 16.2
    # + pgvector binaries for Windows/macOS/Linux so a plain `pip install`
    # needs no PostgreSQL/Supabase/remote-DB setup - see
    # src/aep/db/local_postgres.py. Only ships wheels for CPython 3.9-3.12
    # today (verified against PyPI's file list for 0.1.4), which is why
    # `requires-python`'s upper bound moved from unbounded to `<3.13` - a
    # real, currently-load-bearing constraint, not an arbitrary one.
    "pgserver>=0.1.4",
    # The CEO demo's `run_tests` step runs a REAL pytest against the demo
    # fixture repo (never a model claiming "tests passed" - see
    # ARCHITECTURE.md Verification Philosophy). Verified live: without
    # this, a wheel-only install reports `run_tests QUARANTINED` because
    # the binary genuinely isn't there. It is a runtime dependency of a
    # shipped product feature, not just test tooling.
    "pytest>=8.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
dev = ["pytest>=8.0"]  # kept for explicitness; pytest is also a core dep (see above)
# Real Python dependency/CVE scanning (Phase 3). Node.js scanning uses the
# system `npm` binary directly and needs no Python package.
dependency-scanning = ["pip-audit>=2.6"]
# Stage D product API layer (single lightweight framework dependency).
api = ["flask>=3.0"]
# BUG-0008: these were previously undeclared anywhere - real functional
# dependencies (verified by AST-walking every import under src/), each
# already guarded with a local/lazy `import` inside the function that
# needs it (never a module-level import), so nothing crashes without
# them - the affected capability just honestly reports "not installed"
# (see src/aep/infra/validation.py, drift.py,
# scanners/terraform_deep_scanner.py). Declaring them here is a
# reproducibility fix, not a behavior change: a clean install without
# this extra still works identically to how this dev sandbox happened to
# behave before this fix (silently relying on packages that were already
# present but undeclared).
infra = [
    "boto3>=1.35",           # src/aep/infra/cloud/aws_adapter.py - read-only AWS adapter
    "bc-python-hcl2>=0.4",   # src/aep/infra/{validation,drift}.py, scanners/terraform_deep_scanner.py - real HCL2 parse, no `terraform` binary needed
    "kubernetes-validate>=1.28",  # src/aep/infra/validation.py - real K8s manifest schema validation
]
# src/aep/cicd/artifact.py - real CycloneDX SBOM generation.
sbom = ["cyclonedx-python-lib>=7.0"]
# src/aep/github/client.py - real GitHub API HTTP client.
github = ["requests>=2.31"]
# OPTIONAL heavy scanners. Deliberately NOT core dependencies:
#
#   secrets  -> built in. `security/scanners/builtin_secret_scanner.py` wraps
#               `redaction.find_secrets()`, so secret detection works after a
#               plain `pip install aep-platform` with no extra and no binary.
#               `gitleaks` is still used automatically when present (more
#               rules), but is never required.
#   IaC      -> built in. `infra/scanners/` has real, dependency-free
#               Terraform/Kubernetes checks, so `aep scan` covers IaC out of
#               the box. `checkov` (2.3MB wheel, Apache-2.0, pure-python)
#               below adds breadth, not baseline capability.
#   SAST     -> NOT built in. Semgrep's wheels are 45-79MB per platform;
#               forcing that into every install to cover a capability most
#               users' repos may not need is a dependency bomb, so it is an
#               opt-in extra rather than a silent 50MB tax.
#   containers-> no safe self-contained option exists: image scanning needs
#               registry network access and a vulnerability database, so it
#               is reported BLOCKED rather than shipped broken.
sast = ["semgrep>=1.60"]
iac = ["checkov>=3.2"]
# Union of every real optional integration (excludes `dev`, which is
# test-tooling only, not a runtime capability). Self-reference must use
# the DISTRIBUTION name (aep-platform), not the import package (aep) -
# pip resolves extras-of-self by the name on PyPI/in this file's [project]
# table, not by what `import` uses.
all = ["aep-platform[anthropic,dependency-scanning,api,infra,sbom,github,sast,iac]"]

[project.urls]
Repository = "https://github.com/CloudYatriOps/infraops"
Documentation = "https://github.com/CloudYatriOps/infraops/blob/main/README.md"
"Bug Tracker" = "https://github.com/CloudYatriOps/infraops/blob/main/BUGFIX.md"

[project.scripts]
aep = "aep.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aep*"]

# BUG-0014 closure: the migration .sql files and the demo fixture were
# previously OUTSIDE `src/aep/` (`supabase/migrations/`,
# `demo_project_template/`), so `packages.find` never shipped them and a
# wheel install could not locate them. They now live inside the package
# and ship as package data. `ui_dist/` is the production Vite build, so a
# normal install needs no Node/npm.
[tool.setuptools.package-data]
aep = ["ui_dist/**/*", "migrations_sql/*.sql", "demo_template/**/*", "demo_template/.gitignore", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
